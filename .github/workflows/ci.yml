name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: Backend (syntax check, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt ruff
      # Syntax errors and undefined names only; style rules are not enforced yet.
      - run: ruff check --select E9,F63,F7,F82 .
      - run: python -m pytest -q

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      HCPP_JWT_SECRET: ci-only-secret-not-for-production-0123456789abcdef
      HCPP_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API (SQLite fallback, seeded)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          alembic upgrade head
          python -m app.seed --reset
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
      - name: Build and start web
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm run start > ../web.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000/login http://localhost:8000/api/docs || (cat ../api.log ../web.log; exit 1)
      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test --project=desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/test-results
            api.log
            web.log

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  lighthouse:
    name: Lighthouse budgets (landing)
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run start > ../web.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000/login
      - run: npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.json
