name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: ./backend
          - name: web
            context: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: Deploy (stub)
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # The deploy target is not chosen yet. Replace this step with one of:
      #   - SSH to a VPS and run `docker compose pull && docker compose up -d`
      #   - call a Render / Fly.io / Railway deploy hook
      # Keep the `production` environment so approvals and secrets stay gated.
      - run: |
          echo "Images published to $IMAGE_PREFIX-api and $IMAGE_PREFIX-web."
          echo "No deploy target configured. See comments in .github/workflows/cd.yml."
